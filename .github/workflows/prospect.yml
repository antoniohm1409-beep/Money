name: Find leads
run-name: Find leads (${{ github.event_name }})

# Finds local businesses with weak websites and audits them. No AI and no secrets involved:
# the agents (Claude) pick the results up from data/leads/ afterwards.
on:
  schedule:
    - cron: "23 10 * * 1-5"   # weekdays 10:23 UTC, before the daily agent run
  workflow_dispatch:
    inputs:
      max:
        description: "Websites to audit this run (blank = config.yaml value)"
        required: false
      city:
        description: "Only this city (blank = all cities in config.yaml)"
        required: false

permissions:
  contents: write

concurrency:
  group: prospect
  cancel-in-progress: false

jobs:
  prospect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Check repository visibility
        id: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "private=$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" >> "$GITHUB_OUTPUT"
      - name: Audit websites
        env:
          MAX: ${{ inputs.max }}
          CITY: ${{ inputs.city }}
          REPO_PRIVATE: ${{ steps.repo.outputs.private }}
        run: |
          args=()
          [ -n "$MAX" ] && args+=(--max "$MAX")
          [ -n "$CITY" ] && args+=(--city "$CITY")
          # While the repository is public, lead data would be visible to everyone:
          # run in dry mode (counts only, nothing saved) until it is made private.
          if [ "$REPO_PRIVATE" != "true" ]; then
            echo "::warning::Repository is public - dry run only. Make it private to start saving leads."
            args+=(--dry-run)
          fi
          python -m pipeline.run "${args[@]}"
      - name: Save new leads
        if: steps.repo.outputs.private == 'true'
        run: |
          git config user.name "lead-finder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new data."
          else
            git commit -m "data: leads $(date -u +%F)"
            git pull --rebase --autostash
            git push
          fi
